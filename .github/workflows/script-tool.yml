name: Script tool

# The club's copy of the script tool at skript.doupeol.cz: Štefan Bačkor's BoardGames (MIT,
# github.com/stefanbackor/boardgames, app apps/botc) in the Vercel project botc-skript (root directory apps/botc,
# Node 22 like upstream's CI). Every night the newest upstream main goes live once upstream's checks have passed,
# as it is but for what is done here and not upstream: no Google Analytics, buttons to load a script from the club's
# library and to save one into it (scripts/script-tool-html.mjs), the homebrew characters of the club's collections
# and a set to pick characters from in the dialog for adding them, a sidebar with the characters to add with a click,
# a button for a new script (scripts/script-tool.patch). A change to those goes live when pushed; run it by hand to
# deploy at once.
on:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - scripts/script-tool-html.mjs
      - scripts/script-tool.patch
      - .github/workflows/script-tool.yml
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when this upstream commit is live already
        type: boolean
        default: false

concurrency:
  group: script-tool
  cancel-in-progress: false

jobs:
  deploy:
    name: Upstream main to skript.doupeol.cz
    runs-on: ubuntu-24.04
    env:
      UPSTREAM: stefanbackor/boardgames
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # the project botc-skript; secrets.VERCEL_PROJECT_ID is the club web's own
      VERCEL_PROJECT_ID: prj_iLWALsPqryLj2iVMhBt7tP2m9nCF
    steps:
      - name: Newest upstream commit, its checks and the live one
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          # only the steps that need it get the token: it can change every Vercel project of the account
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # the club's changes are new even when upstream's commit is live already
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          sha=$(gh api "repos/$UPSTREAM/commits/main" --jq .sha)
          # upstream's tests, lint and e2e of the tool; Chromatic checks their other app, Dependabot's runs (its
          # dependency updates, listed on the commit too) test nothing of the tool
          runs=$(gh api "repos/$UPSTREAM/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | test("chromatic|dependabot"; "i") | not) | (.conclusion // .status)]')
          # the upstream commit of each deployment is kept in its meta (see Deploy)
          live=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?teamId=$VERCEL_ORG_ID&projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].meta.upstreamSha // empty')
          echo "upstream main $sha, checks $(jq -c 'group_by(.) | map({(.[0]): length}) | add // {}' <<< "$runs"), live ${live:-nothing}"
          deploy=false
          if [ "$sha" = "$live" ] && [ "$FORCE" != true ]; then
            echo "Live already."
          elif [ "$(jq 'length > 0 and all(. == "success" or . == "skipped" or . == "neutral")' <<< "$runs")" != true ]; then
            # still running or failed: the next run tries again, the live version stays
            echo "::warning::Upstream main $sha has not passed its checks (yet), not deploying."
          else
            deploy=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.upstream.outputs.deploy == 'true'
      - uses: actions/checkout@v7
        if: steps.upstream.outputs.deploy == 'true'
        with:
          repository: stefanbackor/boardgames
          ref: ${{ steps.upstream.outputs.sha }}
          path: boardgames
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.upstream.outputs.deploy == 'true'
        with:
          node-version: 24
      - name: The club's changes (no Google Analytics, the buttons to load from and save into Doupě, homebrew, sets, sidebar)
        if: steps.upstream.outputs.deploy == 'true'
        run: |
          node scripts/script-tool-html.mjs boardgames/apps/botc/index.html
          # made with `git diff` in a checkout of upstream; when upstream changes the lines it touches, it does not
          # apply and the live copy stays until the patch is made again on the new upstream
          git -C boardgames apply --verbose "$GITHUB_WORKSPACE/scripts/script-tool.patch" || {
            echo "::error::scripts/script-tool.patch does not apply to upstream main $SHA any more – make it again there"
            exit 1
          }
        env:
          SHA: ${{ steps.upstream.outputs.sha }}
      # Installed from the club's checkout, not run with npx in upstream's: there upstream's .npmrc (registry) or a
      # committed node_modules/.bin/vercel would decide what runs with the token. Same version as in ci.yml.
      - name: Vercel CLI
        if: steps.upstream.outputs.deploy == 'true'
        run: npm install --global vercel@63.1.2
      - name: Deploy
        if: steps.upstream.outputs.deploy == 'true'
        # built on Vercel from the whole monorepo (yarn workspaces); the commit goes into the deployment's meta
        run: vercel deploy --cwd boardgames --prod --yes --token="$VERCEL_TOKEN" --meta upstreamSha="$SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ steps.upstream.outputs.sha }}
